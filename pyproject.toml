[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socialdl"
version = "0.3.0"
description = "Save images/videos from public Instagram, TikTok, and Facebook accounts — a CLI, MCP server, and HTTP API built for humans and AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "socialdl contributors" }]
keywords = [
    "instagram", "tiktok", "facebook", "downloader", "gallery-dl",
    "mcp", "agent", "media", "scraper",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "gallery-dl>=1.32",
    "yt-dlp>=2025.1",
    "mcp>=1.2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/OWNER/socialdl"
Repository = "https://github.com/OWNER/socialdl"
Issues = "https://github.com/OWNER/socialdl/issues"

[project.scripts]
socialdl = "socialdl.cli:main"
socialdl-mcp = "socialdl.mcp_server:main"
socialdl-serve = "socialdl.http_server:main"

[tool.setuptools]
packages = ["socialdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
